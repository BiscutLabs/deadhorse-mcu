# Loaded after the runner sets the local simulation port.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port $sim_port
adapter speed 100
reset_config srst_only
jtag newtap deadhorse tap -irlen 5 -expected-id 0x00000db3
target create deadhorse.lite riscv -chain-position deadhorse.tap -coreid 0
target create deadhorse.perf riscv -chain-position deadhorse.tap -coreid 1
gdb_port disabled
telnet_port disabled
tcl_port disabled
riscv set_command_timeout_sec 5
init
