block: mixed
description: Adversarial mixed fields, not a recommended peripheral layout
data_width: 32
address_width: 6
registers:
  - name: mixed
    offset: 0
    fields:
      - {name: setting, bits: [2, 0], access: rw, reset: 5}
      - {name: live, bits: [5, 3], access: ro}
      - {name: cmd, bits: [10, 6], access: wo}
      - {name: other_cmd, bits: [15, 11], access: wo}
      - {name: pulse, bits: [19, 16], access: w1p}
      - {name: flags, bits: [23, 20], access: w1c, reset: 10}
      - {name: hwvalue, bits: [31, 24], access: rwh, reset: 0xAB}
  - name: edges
    offset: 0x3C
    fields:
      - {name: cmd, bits: [23, 16], access: wo}
      - {name: flag, bits: 31, access: w1c, reset: 1}
