block: pinmux
description: GPIO alternates and unified timer pad routing
data_width: 32
address_width: 8
registers:
- name: select
  offset: 0x00
  count: 3
  fields: [{name: source, bits: [1, 0], access: rw, reset: 0}]
- name: active
  offset: 0x10
  count: 3
  fields: [{name: source, bits: [1, 0], access: ro}]
- name: settling
  offset: 0x20
  fields: [{name: pads, bits: [2, 0], access: ro}]
- name: timer_select
  offset: 0x40
  count: 13
  fields: [{name: channel, bits: [3, 0], access: rw, reset: 15}]
- name: capture_select
  offset: 0x80
  count: 4
  fields: [{name: channel, bits: [3, 0], access: rw, reset: 15}]
- name: timer_active
  offset: 0xa0
  count: 13
  fields: [{name: channel, bits: [3, 0], access: ro}]
- name: capture_active
  offset: 0xe0
  count: 4
  fields: [{name: channel, bits: [3, 0], access: ro}]
- name: route_events
  offset: 0xf0
  fields: [{name: rejected, bits: 0, access: w1c, reset: 0}]
