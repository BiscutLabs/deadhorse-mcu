block: boot_control
description: Performance-owned lite reset hold and release
data_width: 32
address_width: 8
registers:
  - name: status
    offset: 0x00
    fields:
      - {name: held, bits: 0, access: ro}
      - {name: released, bits: 1, access: ro}
      - {name: draining, bits: 2, access: ro}
      - {name: fresh_performance_reset, bits: 3, access: ro}
      - {name: context_ready, bits: 4, access: ro}
  - name: release_core
    offset: 0x04
    fields: [{name: key, bits: [31, 0], access: wo}]
  - name: events
    offset: 0x08
    fields: [{name: command_error, bits: 0, access: w1c, reset: 0}]
  - name: hold_core
    offset: 0x0c
    fields: [{name: key, bits: [31, 0], access: wo}]
  - name: boot_mode
    offset: 0x10
    fields: [{name: uart_recovery, bits: 0, access: ro}]
  - name: context_commit
    offset: 0x14
    fields: [{name: key, bits: [31, 0], access: wo}]
