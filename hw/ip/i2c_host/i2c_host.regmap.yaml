block: i2c_host
description: Owner checked byte command I2C controller
data_width: 32
address_width: 8
registers:
  - name: configuration
    offset: 0x00
    fields:
      - {name: enable, bits: 0, access: rw, reset: 0}
  - name: timing
    offset: 0x04
    fields:
      - {name: hold, bits: [7, 0], access: rw, reset: 8}
      - {name: low, bits: [15, 8], access: rw, reset: 24}
      - {name: high, bits: [23, 16], access: rw, reset: 22}
      - {name: free, bits: [31, 24], access: rw, reset: 120}
  - name: timeout
    offset: 0x08
    fields:
      - {name: cycles, bits: [15, 0], access: rw, reset: 65535}
  - name: command
    offset: 0x0c
    fields:
      - {name: start, bits: 0, access: w1p}
      - {name: write, bits: 1, access: w1p}
      - {name: read, bits: 2, access: w1p}
      - {name: stop, bits: 3, access: w1p}
      - {name: recover, bits: 4, access: w1p}
      - {name: apply, bits: 5, access: w1p}
      - {name: ack, bits: 6, access: w1p}
      - {name: pop, bits: 7, access: w1p}
  - name: tx_data
    offset: 0x10
    fields:
      - {name: value, bits: [7, 0], access: rw, reset: 0}
  - name: rx_data
    offset: 0x14
    fields:
      - {name: value, bits: [7, 0], access: ro}
  - name: status
    offset: 0x18
    fields:
      - {name: busy, bits: 0, access: ro}
      - {name: owned, bits: 1, access: ro}
      - {name: rx_valid, bits: 2, access: ro}
      - {name: last_ack, bits: 3, access: ro}
      - {name: scl, bits: 4, access: ro}
      - {name: sda, bits: 5, access: ro}
      - {name: enabled, bits: 6, access: ro}
  - name: events
    offset: 0x1c
    fields:
      - {name: done, bits: 0, access: w1c, reset: 0}
      - {name: nack, bits: 1, access: w1c, reset: 0}
      - {name: arbitration_lost, bits: 2, access: w1c, reset: 0}
      - {name: timeout, bits: 3, access: w1c, reset: 0}
      - {name: command_error, bits: 4, access: w1c, reset: 0}
      - {name: recovered, bits: 5, access: w1c, reset: 0}
      - {name: bus_fault, bits: 6, access: w1c, reset: 0}
  - name: irq_enable
    offset: 0x20
    fields:
      - {name: mask, bits: [6, 0], access: rw, reset: 0}
      - {name: rx_valid, bits: 7, access: rw, reset: 0}
  - name: active_timing
    offset: 0x24
    fields:
      - {name: hold, bits: [7, 0], access: ro}
      - {name: low, bits: [15, 8], access: ro}
      - {name: high, bits: [23, 16], access: ro}
      - {name: free, bits: [31, 24], access: ro}
  - name: active_timeout
    offset: 0x28
    fields:
      - {name: cycles, bits: [15, 0], access: ro}
