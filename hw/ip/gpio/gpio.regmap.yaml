block: gpio
description: Three GPIOs with main edge events and acknowledged AON level wake
data_width: 32
address_width: 8
registers:
  - name: output_value
    offset: 0x00
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: output_enable
    offset: 0x04
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: input_value
    offset: 0x08
    fields: [{name: pins, bits: [2, 0], access: ro}]
  - name: rise_enable
    offset: 0x0c
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: fall_enable
    offset: 0x10
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: events
    offset: 0x14
    fields:
      - {name: edges, bits: [2, 0], access: w1c, reset: 0}
      - {name: command_error, bits: 3, access: w1c, reset: 0}
  - name: irq_enable
    offset: 0x18
    fields:
      - {name: edges, bits: [2, 0], access: rw, reset: 0}
      - {name: wake, bits: 3, access: rw, reset: 0}
  - name: wake_mask
    offset: 0x1c
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: wake_polarity
    offset: 0x20
    fields: [{name: pins, bits: [2, 0], access: rw, reset: 0}]
  - name: command
    offset: 0x24
    fields:
      - {name: apply, bits: 0, access: w1p}
      - {name: clear_wake, bits: 1, access: w1p}
  - name: status
    offset: 0x28
    fields:
      - {name: busy, bits: 0, access: ro}
      - {name: armed, bits: 1, access: ro}
      - {name: pending, bits: 2, access: ro}
      - {name: ready, bits: 3, access: ro}
