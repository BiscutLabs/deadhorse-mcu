block: timers
description: Three shared-period general timers and microsecond timebase
data_width: 32
address_width: 10
registers:
- name: time_control
  offset: 0
  fields: [{name: run, bits: 0, access: rw, reset: 0}]
- name: time_value
  offset: 4
  fields: [{name: value, bits: [31, 0], access: ro}]
- name: time_preload
  offset: 8
  fields: [{name: value, bits: [31, 0], access: rw, reset: 0}]
- name: time_command
  offset: 12
  fields: [{name: load, bits: 0, access: w1p}]
- name: pending
  offset: 16
  fields: [{name: channels, bits: [11, 0], access: ro}]
- name: apply
  offset: 20
  fields: [{name: channels, bits: [11, 0], access: w1p}]
- name: events
  offset: 24
  fields: [{name: channels, bits: [11, 0], access: w1c, reset: 0}]
- name: irq_enable
  offset: 28
  fields: [{name: events, bits: [23, 0], access: rw, reset: 0}]
- name: dma_enable
  offset: 32
  fields: [{name: channels, bits: [8, 0], access: rw, reset: 0}]
- name: dma_ack
  offset: 36
  fields: [{name: channels, bits: [8, 0], access: w1p}]
- name: dma_pending
  offset: 40
  fields: [{name: channels, bits: [8, 0], access: ro}]
- name: dma_overrun
  offset: 44
  fields: [{name: channels, bits: [8, 0], access: w1c, reset: 0}]
- name: timer_run
  offset: 48
  fields: [{name: timers, bits: [2, 0], access: rw, reset: 0}]
- name: config_error
  offset: 52
  fields: [{name: timers, bits: [2, 0], access: w1c, reset: 0}]
- name: period
  offset: 64
  count: 3
  fields: [{name: value, bits: [15, 0], access: rw, reset: 0}]
- name: prescaler
  offset: 80
  count: 3
  fields: [{name: value, bits: [15, 0], access: rw, reset: 0}]
- name: channel_mode
  offset: 128
  count: 12
  fields:
  - {name: mode, bits: [1, 0], access: rw, reset: 0}
  - {name: output_enable, bits: 2, access: rw, reset: 0}
  - {name: falling, bits: 3, access: rw, reset: 0}
- name: compare
  offset: 192
  count: 12
  fields: [{name: value, bits: [16, 0], access: rw, reset: 0}]
- name: captured
  offset: 256
  count: 12
  fields: [{name: value, bits: [31, 0], access: ro}]
- name: counter
  offset: 320
  count: 3
  fields: [{name: value, bits: [15, 0], access: ro}]
