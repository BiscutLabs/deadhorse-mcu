block: aon_gpio
description: Lite-owned retained GPIO and short-pulse events
data_width: 32
address_width: 8
registers:
- name: input_value
  offset: 0
  fields: [{name: pins, bits: [5, 0], access: ro}]
- name: output_value
  offset: 4
  fields: [{name: pins, bits: [5, 0], access: rw, reset: 0}]
- name: output_enable
  offset: 8
  fields: [{name: pins, bits: [5, 0], access: rw, reset: 0}]
- name: pending
  offset: 12
  fields: [{name: pins, bits: [5, 0], access: ro}]
- name: event_enable
  offset: 16
  fields: [{name: pins, bits: [5, 0], access: rw, reset: 0}]
- name: clear_events
  offset: 20
  fields: [{name: pins, bits: [5, 0], access: w1p}]
- name: polarity
  offset: 24
  fields: [{name: falling, bits: [5, 0], access: rw, reset: 0}]
- name: armed
  offset: 28
  fields: [{name: pins, bits: [5, 0], access: ro}]
- name: mux
  offset: 32
  fields:
  - {name: aon_owner, bits: [2, 0], access: rw, reset: 0}
  - {name: spi_enable, bits: 3, access: rw, reset: 0}
