block: usb
description: Owner-checked USB CDC byte transport with explicit receive consumption
data_width: 32
address_width: 8
registers:
  - name: control
    offset: 0x00
    fields:
      - {name: enable, bits: 0, access: rw, reset: 0}
  - name: tx_data
    offset: 0x04
    fields:
      - {name: value, bits: [7, 0], access: wo}
  - name: command
    offset: 0x08
    fields:
      - {name: rx_pop, bits: 0, access: w1p}
      - {name: wake_ack, bits: 1, access: w1p}
  - name: rx_data
    offset: 0x0c
    fields:
      - {name: value, bits: [7, 0], access: ro}
  - name: status
    offset: 0x10
    fields:
      - {name: tx_ready, bits: 0, access: ro}
      - {name: rx_valid, bits: 1, access: ro}
      - {name: configured, bits: 2, access: ro}
      - {name: connected, bits: 3, access: ro}
  - name: events
    offset: 0x14
    fields:
      - {name: tx_overflow, bits: 0, access: w1c, reset: 0}
      - {name: rx_underflow, bits: 1, access: w1c, reset: 0}
      - {name: session_reset, bits: 2, access: w1c, reset: 0}
      - {name: host_resume, bits: 3, access: w1c, reset: 0}
  - name: irq_enable
    offset: 0x18
    fields:
      - {name: rx_valid, bits: 0, access: rw, reset: 0}
      - {name: events, bits: 1, access: rw, reset: 0}
  - name: frame
    offset: 0x1c
    fields:
      - {name: value, bits: [10, 0], access: ro}
