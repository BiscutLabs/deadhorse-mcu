block: qspi
description: Bounded serial and quad flash command interface
data_width: 32
address_width: 12
registers:
  - name: configuration
    offset: 0x00
    fields:
      - {name: chip_select, bits: 0, access: rw, reset: 0}
      - {name: address_bytes, bits: [3, 1], access: rw, reset: 0}
      - {name: data_bytes, bits: [6, 4], access: rw, reset: 0}
      - {name: read_data, bits: 7, access: rw, reset: 0}
      - {name: quad_address, bits: 8, access: rw, reset: 0}
      - {name: quad_data, bits: 9, access: rw, reset: 0}
  - name: timing
    offset: 0x04
    fields:
      - {name: half_period, bits: [7, 0], access: rw, reset: 4}
      - {name: dummy_clocks, bits: [12, 8], access: rw, reset: 0}
  - name: opcode
    offset: 0x08
    fields: [{name: value, bits: [7, 0], access: rw, reset: 0}]
  - name: address
    offset: 0x0c
    fields: [{name: value, bits: [31, 0], access: rw, reset: 0}]
  - name: tx_data
    offset: 0x10
    fields: [{name: value, bits: [31, 0], access: rw, reset: 0}]
  - name: launch
    offset: 0x14
    fields: [{name: key, bits: [31, 0], access: wo}]
  - name: rx_data
    offset: 0x18
    fields: [{name: value, bits: [31, 0], access: ro}]
  - name: status
    offset: 0x1c
    fields:
      - {name: busy, bits: 0, access: ro}
      - {name: owner, bits: [3, 1], access: ro}
  - name: events
    offset: 0x20
    fields:
      - {name: done, bits: 0, access: w1c, reset: 0}
      - {name: command_error, bits: 1, access: w1c, reset: 0}
  - name: handoff
    offset: 0x24
    fields: [{name: key, bits: [31, 0], access: wo}]
