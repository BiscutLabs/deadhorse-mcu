block: pwm
description: Independent buffered PWM channels
data_width: 32
address_width: 8
registers:
- name: apply
  offset: 0x00
  fields: [{name: channels, bits: [8, 0], access: w1p}]
- name: stop
  offset: 0x04
  fields: [{name: channels, bits: [8, 0], access: w1p}]
- name: running
  offset: 0x08
  fields: [{name: channels, bits: [8, 0], access: ro}]
- name: pending
  offset: 0x0c
  fields: [{name: channels, bits: [8, 0], access: ro}]
- name: events
  offset: 0x10
  fields:
  - {name: rollover, bits: [8, 0], access: w1c, reset: 0}
  - {name: config_error, bits: [17, 9], access: w1c, reset: 0}
  - {name: overrun, bits: [26, 18], access: w1c, reset: 0}
- name: irq_enable
  offset: 0x14
  fields: [{name: events, bits: [26, 0], access: rw, reset: 0}]
- name: dma_enable
  offset: 0x18
  fields: [{name: channels, bits: [8, 0], access: rw, reset: 0}]
- name: dma_ack
  offset: 0x1c
  fields: [{name: channels, bits: [8, 0], access: w1p}]
- name: dma_pending
  offset: 0x20
  fields: [{name: channels, bits: [8, 0], access: ro}]
- name: period
  offset: 0x40
  count: 9
  fields: [{name: value, bits: [15, 0], access: rw, reset: 0}]
- name: divider
  offset: 0x80
  count: 9
  fields: [{name: value, bits: [15, 0], access: rw, reset: 0}]
- name: high_time
  offset: 0xc0
  count: 9
  fields: [{name: value, bits: [16, 0], access: rw, reset: 0}]
