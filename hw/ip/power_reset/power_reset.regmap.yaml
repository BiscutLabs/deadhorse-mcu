block: power_reset
description: AON reset reasons and safe brownout threshold control
data_width: 32
address_width: 8
registers:
  - name: reason
    offset: 0x00
    fields:
      - {name: causes, bits: [5, 0], access: ro}
  - name: threshold
    offset: 0x04
    fields:
      - {name: selection, bits: [1, 0], access: rw, reset: 0}
  - name: apply
    offset: 0x08
    fields:
      - {name: key, bits: [31, 0], access: wo}
  - name: active
    offset: 0x0c
    fields:
      - {name: selection, bits: [1, 0], access: ro}
  - name: events
    offset: 0x10
    fields:
      - {name: invalid, bits: 0, access: w1c, reset: 0}
